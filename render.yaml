# Render Blueprint — render.yaml
# Dashboard > New > Blueprint → bu dosyayı seç
#
# NOT: Render'da ayrı bir "Cron Job" servisi KURULMAZ — cron job'ları aylık en az
# $1 tutuyor ve kredi kartı istiyor. Instance'ı uyanık tutma işini uygulamanın
# kendi içindeki Nitro görevi yapıyor (poll:keepalive, 5 dakikada bir self-ping).
services:
  - type: web
    name: swaggybark-panel
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/poll/current
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: swaggybark
      - key: VOTE_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: KICK_CHANNEL
        value: swaggybark
      - key: KICK_UA
        value: swaggybark-panel/1.0
